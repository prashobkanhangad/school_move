name: parent_app
description: SchoolMove Parent — track your child’s school bus.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  go_router: ^14.8.1
  socket_io_client: ^3.1.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  google_maps_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/adaptive_fg.png
  adaptive_icon_foreground_inset: 12
  min_sdk_android: 21
