allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

gradle.beforeProject { project ->
    if (project.name != "app") {
        project.ext.flutter = [
            compileSdkVersion: 36,
            minSdkVersion: 24,
            targetSdkVersion: 36,
            versionCode: 1,
            versionName: "1.0.0",
        ]
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Plugins like google_maps_flutter_android still pin compileSdk 34; force 35+.
subprojects { project ->
    project.plugins.withId("com.android.library") {
        project.android {
            compileSdk = 36
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
